  <link rel="stylesheet" href="css/custom.css">

<body class="bg-slate-100 min-h-screen text-slate-800 antialiased font-sans flex flex-col h-screen overflow-hidden">

  <!-- SIDEBAR FLOTANTE TIPO CAJÓN (DRAWER) - OCULTO POR DEFECTO -->

          M

        <div class="leading-tight">

    <!-- Opciones de Navegación -->

      <!-- Ventas -->
      <div>
        <span class="text-[10px] font-black text-slate-500 uppercase tracking-widest px-3 block mb-2">Ventas & Mostrador</span>
        <div class="space-y-1">
          <button id="nav_pos" onclick="navegarA('pos')" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-bold text-slate-300 hover:bg-slate-800 hover:text-white transition cursor-pointer">
            <span class="text-base text-cyan-400 shrink-0">⚡</span>
            <span class="whitespace-nowrap flex-1 text-left">Terminal de Cobro</span>
            <span class="text-[10px] bg-cyan-950 text-cyan-300 border border-cyan-800 px-1.5 py-0.5 rounded font-mono">F10</span>
          </button>

          <button id="nav_ventas" onclick="navegarA('ventas')" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-bold text-slate-300 hover:bg-slate-800 hover:text-white transition cursor-pointer">
            <span class="text-base text-emerald-400 shrink-0">📊</span>
            <span class="whitespace-nowrap flex-1 text-left">Historial de Ventas</span>
          </button>
        </div>
      </div>

      <!-- Inventario Comercial -->
      <div>
        <span class="text-[10px] font-black text-slate-500 uppercase tracking-widest px-3 block mb-2">Inventario Comercial</span>
        <div class="space-y-1">
          <button id="nav_pvp" onclick="navegarA('pvp')" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-bold text-slate-300 hover:bg-slate-800 hover:text-white transition cursor-pointer">
            <span class="text-base text-emerald-400 shrink-0">🏷️</span>
            <span class="whitespace-nowrap flex-1 text-left">Precios & PVP</span>
            <span id="badgeNavPVP" class="bg-slate-800 text-[10px] px-2 py-0.5 rounded-full font-mono text-slate-300">0</span>
          </button>

          <button id="nav_vencimientos" onclick="navegarA('vencimientos')" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-bold text-slate-300 hover:bg-slate-800 hover:text-white transition cursor-pointer">
            <span class="text-base text-amber-400 shrink-0">⏳</span>
            <span class="whitespace-nowrap flex-1 text-left">Control Vencimientos</span>
            <span id="badgeNavVencimientos" class="bg-slate-800 text-[10px] px-2 py-0.5 rounded-full font-mono text-slate-300">0</span>
          </button>
        </div>
      </div>

      <!-- Compras y Costos -->
      <div>
        <span class="text-[10px] font-black text-slate-500 uppercase tracking-widest px-3 block mb-2">Compras & Gastos</span>
        <div class="space-y-1">
          <button id="nav_auditoria" onclick="navegarA('auditoria')" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-bold text-slate-300 hover:bg-slate-800 hover:text-white transition cursor-pointer">
            <span class="text-base text-blue-400 shrink-0">📑</span>
            <span class="whitespace-nowrap flex-1 text-left">Facturas de Compra</span>
            <span id="badgeNavAuditoria" class="bg-slate-800 text-[10px] px-2 py-0.5 rounded-full font-mono text-slate-300">0</span>
          </button>

          <button id="nav_catalogo" onclick="navegarA('catalogo')" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-bold text-slate-300 hover:bg-slate-800 hover:text-white transition cursor-pointer">
            <span class="text-base text-purple-400 shrink-0">📦</span>
            <span class="whitespace-nowrap flex-1 text-left">Catálogo de Costos</span>
            <span id="badgeNavCatalogo" class="bg-slate-800 text-[10px] px-2 py-0.5 rounded-full font-mono text-slate-300">0</span>
          </button>

    </div>

    <!-- Pie del Sidebar -->
    <div class="p-3 border-t border-slate-800 bg-slate-950/40 text-[11px] text-slate-400 flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-emerald-500 shrink-0 animate-pulse"></span>
      <span>Conectado a Neon DB</span>
    </div>

  <!-- ENCABEZADO SUPERIOR -->
  <header class="bg-white border-b border-slate-200 px-5 py-3 flex justify-between items-center shrink-0 shadow-xs z-10">
    <div class="flex items-center gap-3">
      <!-- Botón Hamburguesa ☰ -->
      <button onclick="abrirSidebar()" class="p-2 rounded-xl text-slate-700 hover:bg-slate-100 transition cursor-pointer border border-slate-200 shadow-2xs" title="Abrir Menú">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>

      <div>
        <h2 id="txtTituloVistaActual" class="text-sm font-black text-slate-900 tracking-tight">Terminal de Ventas</h2>
        <p id="txtSubtituloVistaActual" class="text-[11px] text-slate-400">Punto de venta y despacho de mostrador</p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <!-- Botón que cambia de pestaña y abre el modal de subida -->
      <button onclick="manejarClickCargarFactura()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-black px-4 py-2 rounded-xl transition shadow-xs cursor-pointer flex items-center gap-1.5">
        <span>+</span> Cargar Factura
      </button>
    </div>
  </header>

  <!-- CANVAS PRINCIPAL -->
  <main class="flex-1 overflow-y-auto bg-slate-100 relative" id="contenidoPrincipal">
    <!-- Componente activo inyectado por app.js -->
  </main>

  <!-- CONTENEDOR TOAST (NOTIFICACIONES FLOTANTES SIN ALERT) -->
  <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- MODAL NATIVO DE CONFIRMACIÓN (REEMPLAZA confirm()) -->
  <div id="modalConfirmacionGlobal" class="hidden fixed inset-0 bg-slate-950/70 backdrop-blur-xs flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl max-w-sm w-full p-6 text-slate-800 space-y-4 shadow-2xl border border-slate-100">
      <div class="w-12 h-12 rounded-2xl bg-rose-50 text-rose-600 flex items-center justify-center text-xl font-black mx-auto">
        ⚠️
      </div>
      <div class="text-center space-y-1">
        <h3 id="modalConfirmTitulo" class="text-base font-black text-slate-900">¿Estás seguro?</h3>
        <p id="modalConfirmMensaje" class="text-xs text-slate-500 leading-relaxed">Esta acción no se puede deshacer.</p>
      </div>
      <div class="flex gap-2 pt-2 border-t border-slate-100">
        <button id="btnModalConfirmCancelar" class="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-xs transition cursor-pointer">
          Cancelar
        </button>
        <button id="btnModalConfirmAceptar" class="flex-1 py-2.5 bg-rose-600 hover:bg-rose-700 text-white font-black rounded-xl text-xs transition shadow-md cursor-pointer">
          Confirmar
        </button>
      </div>
    </div>
  </div>

  <script>
    // Manejador global para el botón superior "+ Cargar Factura"
    window.manejarClickCargarFactura = function() {
      if (typeof cambiarTab === "function" && state.tabActiva !== "auditoria") {
        cambiarTab("auditoria");
      }
      setTimeout(() => {
        if (window.ComponentePanelEstrategico && typeof ComponentePanelEstrategico.abrirModalSubida === "function") {
          ComponentePanelEstrategico.abrirModalSubida();
        }
      }, 100);
    };

    // Utilidades globales de parseo y formateo de fechas (Estricto DD/MM/YYYY)
    window.parsearFechaISO = function(fechaStr) {
      if (!fechaStr) return null;
      try {
        const str = String(fechaStr).trim();

        // 1. Si ya viene en formato ISO (YYYY-MM-DD)
        if (/^\d{4}-\d{2}-\d{2}/.test(str)) {
          return str.slice(0, 10);
        }

        // 2. Formato latinoamericano estricto DD/MM/YYYY o DD-MM-YYYY
        const partes = str.split(/[\/\-]/);
        if (partes.length === 3) {
          // Si el año viene al final (ej: 02/10/2026 -> día 02, mes 10, año 2026)
          if (partes[2].length === 4) {
            const dia = partes[0].padStart(2, '0');
            const mes = partes[1].padStart(2, '0');
            const anio = partes[2];
            return `${anio}-${mes}-${dia}`;
          }
          // Si el año viene al principio (ej: 2026/10/02)
          if (partes[0].length === 4) {
            const anio = partes[0];
            const mes = partes[1].padStart(2, '0');
            const dia = partes[2].padStart(2, '0');
            return `${anio}-${mes}-${dia}`;
          }
        }

        const d = new Date(str);
        if (!isNaN(d.getTime())) {
          return d.toISOString().slice(0, 10);
        }
        return null;
      } catch {
        return null;
      }
    };

    window.formatearFechaLatam = function(fechaStr) {
      if (!fechaStr) return "S/F";
      const iso = window.parsearFechaISO(fechaStr);
      if (!iso) return String(fechaStr);
      const [y, m, d] = iso.split("-");
      return `${d}/${m}/${y}`;
    };

    // Sistema global de notificaciones Toast
    window.mostrarToast = function(mensaje, tipo = "info") {
      const container = document.getElementById("toastContainer");
      if (!container) return;

      const toast = document.createElement("div");
      toast.className = "pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-2xl shadow-2xl border text-xs font-bold transition-all duration-300 transform translate-y-4 opacity-0";
      
      if (tipo === "success") {
        toast.className += " bg-emerald-950/90 border-emerald-500/50 text-emerald-200 backdrop-blur-md";
        toast.innerHTML = `<span class="text-base text-emerald-400 font-black">✓</span> <span>${mensaje}</span>`;
      } else if (tipo === "error") {
        toast.className += " bg-rose-950/90 border-rose-500/50 text-rose-200 backdrop-blur-md";
        toast.innerHTML = `<span class="text-base text-rose-400 font-black">✕</span> <span>${mensaje}</span>`;
      } else if (tipo === "warning") {
        toast.className += " bg-amber-950/90 border-amber-500/50 text-amber-200 backdrop-blur-md";
        toast.innerHTML = `<span class="text-base text-amber-400 font-black">⚠️</span> <span>${mensaje}</span>`;
      } else {
        toast.className += " bg-slate-900/90 border-slate-700 text-slate-200 backdrop-blur-md";
        toast.innerHTML = `<span class="text-base text-cyan-400 font-black">ℹ</span> <span>${mensaje}</span>`;
      }

      container.appendChild(toast);
      
      requestAnimationFrame(() => {
        toast.classList.remove("translate-y-4", "opacity-0");
      });

      setTimeout(() => {
        toast.classList.add("opacity-0", "translate-y-2");
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    };

    // Diálogo de confirmación personalizado tipo Promise
    window.confirmarAccion = function(titulo, mensaje) {
      return new Promise((resolve) => {
        const modal = document.getElementById("modalConfirmacionGlobal");
        const lblTit = document.getElementById("modalConfirmTitulo");
        const lblMsg = document.getElementById("modalConfirmMensaje");
        const btnOk = document.getElementById("btnModalConfirmAceptar");
        const btnCancel = document.getElementById("btnModalConfirmCancelar");

        lblTit.innerText = titulo;
        lblMsg.innerText = mensaje;
        modal.classList.remove("hidden");

        const cleanup = (resultado) => {
          modal.classList.add("hidden");
          btnOk.onclick = null;
          btnCancel.onclick = null;
          resolve(resultado);
        };

        btnOk.onclick = () => cleanup(true);
        btnCancel.onclick = () => cleanup(false);
      });
    };
  </script>

  <!-- SCRIPTS EN ORDEN ESTRICTO -->
  <script src="js/api.js"></script>
  <script src="js/components/panelEstrategico.js"></script>
  <script src="js/components/inventarioPvp.js"></script>
  <script src="js/components/terminalPos.js"></script>
  <script src="js/components/catalogo.js"></script>
  <script src="js/components/vencimientos.js"></script>
  <script src="js/components/historialVentas.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
