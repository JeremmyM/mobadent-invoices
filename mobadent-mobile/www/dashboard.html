<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Mobadent - Panel Móvil</title>
  <link rel="icon" type="image/x-icon" href="app.ico">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="config.js"></script>
  <script src="db.js"></script>
  <script src="auth-lock.js"></script>
  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 20px);
      --safe-bottom: env(safe-area-inset-bottom, 24px);
    }
    body {
      padding-top: max(var(--safe-top), 20px);
      padding-bottom: calc(var(--safe-bottom) + 105px);
    }
    .nav-bar-flotante {
      bottom: max(var(--safe-bottom), 18px);
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">

  <!-- Barra Superior -->
  <header class="sticky top-0 z-30 bg-slate-100/90 backdrop-blur-md px-5 py-3.5 mb-2">
    <div class="flex items-center justify-between max-w-md mx-auto">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-blue-600 text-white flex items-center justify-center text-xl shadow-md shadow-blue-500/20">
          🦷
        </div>
        <div>
          <h1 class="text-lg font-black text-slate-900 leading-tight">Mobadent</h1>
          <p class="text-[11px] text-slate-400 font-medium">Control Dental & Auditoría</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <span id="badgeEstadoConexion" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[10px] font-bold bg-amber-100 text-amber-800 shadow-2xs">
          <span class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></span> Conectando...
        </span>
        <button onclick="cargarDatosGlobalesMovil()" class="w-8 h-8 rounded-xl bg-white shadow-xs border border-slate-200/80 active:scale-95 text-slate-600 flex items-center justify-center text-xs transition cursor-pointer">
          🔄
        </button>
      </div>
    </div>
  </header>

  <!-- Contenedor Dinámico Principal -->
  <main class="px-5 space-y-4 max-w-md mx-auto" id="mainContainerMobile">
    <div class="p-8 text-center text-slate-400 animate-pulse text-xs">
      Cargando módulos de Mobadent...
    </div>
  </main>

  <!-- Barra Flotante Inferior (Router Móvil) -->
  <div class="fixed nav-bar-flotante inset-x-5 z-40 max-w-sm mx-auto">
    <nav class="bg-white/95 backdrop-blur-md border border-slate-200/80 rounded-3xl px-6 py-2.5 shadow-xl shadow-slate-900/10 flex justify-around items-center">
      <button onclick="routerMovil.navegar('facturas')" id="btnNavFacturas" class="flex flex-col items-center text-blue-600 transition cursor-pointer">
        <span class="text-xl">📊</span>
        <span class="text-[10px] font-bold mt-0.5">Facturas</span>
      </button>
      
      <a href="index.html" class="flex flex-col items-center -mt-8 group cursor-pointer">
        <div class="w-14 h-14 rounded-full bg-blue-600 active:bg-blue-700 text-white flex items-center justify-center text-2xl shadow-lg shadow-blue-500/40 border-4 border-slate-100 active:scale-95 transition">
          📷
        </div>
        <span class="text-[10px] font-bold text-slate-700 mt-1">Escanear</span>
      </a>

      <button onclick="routerMovil.navegar('vencimientos')" id="btnNavVencimientos" class="flex flex-col items-center text-slate-400 active:text-slate-600 transition cursor-pointer">
        <span class="text-xl">⏳</span>
        <span class="text-[10px] font-bold mt-0.5">Caducidades</span>
      </button>

      <button onclick="routerMovil.navegar('catalogo')" id="btnNavCatalogo" class="flex flex-col items-center text-slate-400 active:text-slate-600 transition cursor-pointer">
        <span class="text-xl">📦</span>
        <span class="text-[10px] font-bold mt-0.5">Catálogo</span>
      </button>
    </nav>
  </div>

  <!-- Scripts Modulares -->
  <script src="js/api.js"></script>
  <script src="js/components/panelFacturas.js"></script>
  <script src="js/components/vencimientos.js"></script>
  <script src="js/components/catalogo.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
